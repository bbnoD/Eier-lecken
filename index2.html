<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eier lecken</title>
    <style>
        /* Grunddesign: Füllt den gesamten Bildschirm aus */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0e10; /* Sehr dunkles Schwarz-Blau */
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Trennt Inhalt und Footer */
            overflow: hidden; /* Keine Scrollbalken */
            font-family: 'Arial Black', sans-serif; /* Wuchtige Schrift für den mechanischen Look */
        }

        /* Der massive Flip-Board-Bereich (oben) */
        .massive-board {
            flex-grow: 1; /* Nimmt den restlichen Platz ein */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Container für die zwei Wörter untereinander */
        .board-content {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Spalt zwischen den Wörtern */
            align-items: center;
        }

        /* Eine Reihe (Wort) */
        .row {
            display: flex;
            gap: 10px; /* Spalt zwischen den einzelnen Buchstaben-Kacheln */
        }

        /* Die einzelne Flip-Kachel für jeden Buchstaben */
        .flap {
            position: relative;
            background-color: #1a1d21; /* Dunkler Kachel-Hintergrund */
            width: 15vw; /* Dynamische Breite, passt sich der Bildschirmbreite an */
            height: 25vh; /* Dynamische Höhe, passt sich der Bildschirmhöhe an */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px; /* Abgerundete Ecken */
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); /* Tiefe für den Kachel-Look */
            border: 2px solid #2a3036; /* Feine mechanische Grenze */
        }

        /* Der Buchstabe innerhalb der Kachel, wuchtig */
        .letter {
            text-transform: uppercase;
            color: #d1d9e1; /* Off-white Schriftfarbe */
            font-weight: 900;
            font-size: 18vh; /* Riesige Schriftgröße, passt sich der Kachelhöhe an */
            margin: 0;
            line-height: 1;
        }

        /* Die typische mechanische Trennlinie, die quer durch jeden Buchstaben verläuft */
        .flap::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: rgba(0,0,0,0.4); /* Dunkle mechanische Einkerbung */
            z-index: 2; /* Liegt über dem Buchstaben */
            transform: translateY(-50%);
        }

        /* Der untere Spalt: Schlichter Hintergrund, kein Flip-Effekt */
        .footer-spalt {
            height: 60px; /* Definierter kleiner Spalt */
            background-color: #1a1d21; /* Leicht hellerer, glatter Hintergrund */
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 2px solid #2a2f35; /* Feine Trennlinie */
            position: relative;
            z-index: 10;
        }

        /* Der Text im Spalt */
        .rechte {
            color: #6a737d; /* Abgedunkelte, dezente Farbe */
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: normal;
        }

        /* Responsive Anpassung für kleinere Bildschirme (Handys) */
        @media (max-width: 600px) {
            .flap {
                width: 25vw;
                height: 15vh;
            }
            .letter {
                font-size: 10vh;
            }
            .row {
                gap: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="massive-board">
        <div class="board-content">

            
            <div class="row">
                
                <div class="flap"><span class="letter"></span></div>
                <div class="flap"><span class="letter">E</span></div>
                <div class="flap"><span class="letter">I</span></div>
                <div class="flap"><span class="letter">E</span></div>
                <div class="flap"><span class="letter">R</span></div>
                <div class="flap"><span class="letter"></span></div>
              
                
            </div>
            
            <div class="row">
                <div class="flap"><span class="letter">L</span></div>
                <div class="flap"><span class="letter">E</span></div>
                <div class="flap"><span class="letter">C</span></div>
                <div class="flap"><span class="letter">K</span></div>
                <div class="flap"><span class="letter">E</span></div>
                <div class="flap"><span class="letter">N</span></div>
            </div>

            <div class="row">
                
                <div class="flap"><span class="letter"></span></div>
                <div class="flap"><span class="letter"> </span></div>
                <div class="flap"><span class="letter"></span></div>
                <div class="flap"><span class="letter"></span></div>
                <div class="flap"><span class="letter"></span></div>
                <div class="flap"><span class="letter"></span></div>
              
                
            </div>
            
        </div>
    </div>

    <div class="footer-spalt">
        <div class="rechte">© Alle Rechte vorbehalten LG Niko</div>
    </div>

</body>
</html>

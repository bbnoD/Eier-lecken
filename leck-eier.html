<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eier lecken</title>
    <!-- Eine der edelsten Kursivschriften von Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Ein realistischerer Gold-Verlauf */
            --gold-gradient: linear-gradient(45deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%, #fbf5b7 100%);
            --border-color: #aa771c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Tiefstes Schwarz */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Der goldene Rahmen */
        .gold-border {
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 15%; /* Platz für den Footer lassen */
            border: 2px solid var(--border-color);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Ein zweiter innerer Rahmen für den edlen Effekt */
            outline: 1px solid var(--border-color);
            outline-offset: -15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Der Textbereich */
        .content {
            text-align: center;
            z-index: 10;
        }

        .wort {
            font-family: 'Alex Brush', cursive;
            font-size: 15vw; /* Riesig */
            display: block;
            margin: -2vh 0; /* Zieht die geschwungenen Zeilen näher zusammen */
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Ein leichter Schatten, damit es sich vom Schwarz abhebt */
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
            /* Hinweis: Kursivschrift in reinem "ALL CAPS" ist oft schwer lesbar, 
               daher ist hier nur die Initiale groß, für maximale Eleganz. */
        }

        /* Der untere Spalt (Footer) */
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #1a1a1a;
        }

        .copyright {
            font-family: 'Cinzel', serif;
            color: #444; /* Dezent gehalten */
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="gold-border">
        <div class="content">
            <span class="wort">Eier</span>
            <span class="wort">Lecken</span>
        </div>
    </div>

    <div class="footer">
        <div class="copyright">© Alle Rechte vorbehalten LG Niko</div>
    </div>

</body>
</html>

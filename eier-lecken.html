<style>
    /* Grunddesign: Schwarz-Weiß und minimalistisch */
    .random-wrapper-bw {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #ffffff; /* Weißer Hintergrund */
        font-family: 'Arial Black', sans-serif;
        overflow: hidden;
        position: relative;
    }

    /* Der große Text in der Mitte */
    .spruch-container {
        text-align: center;
        line-height: 0.85;
    }

    .wort-bw {
        font-size: 15vw;
        font-weight: 900;
        text-transform: uppercase;
        display: block;
        margin: 0;
        color: #000;
    }

    /* Der "Stamp" unten */
    .footer-bw {
        position: absolute;
        bottom: 30px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: 2px solid #000;
        padding: 5px 15px;
        transform: rotate(-2deg);
        color: #000;
    }

    /* Mobile Anpassung */
    @media (max-width: 768px) {
        .wort-bw { font-size: 20vw; }
    }
</style>

<div class="random-wrapper-bw">
    <div class="spruch-container">
        <span class="wort-bw">EIER</span>
        <span class="wort-bw">LECKEN</span>
    </div>

    <div class="footer-bw">
        © ALLE RECHTE VORBEHALTEN LG NIKO
    </div>
</div>

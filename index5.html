<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eier lecken</title>
    <style>
        /* Grunddesign: Zentriert alles auf dunklem Hintergrund */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212; /* Dunkles Anthrazit */
            color: #E0E0E0; /* Helles Grau für Text */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertikal zentrieren */
            align-items: center; /* Horizontal zentrieren */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Verhindert Scrollbalken während der Animation */
        }

        /* Der Spruch oben */
        .spruch-oben {
            font-size: 6rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #FFD700; /* Goldgelb */
            margin-bottom: 50px; /* Abstand zum Ei */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            text-align: center;
            padding: 0 20px;
        }

        /* Container für das Ei, um die Animation zu steuern */
        .ei-container {
            font-size: 15rem; /* Riesige Größe für das Symbol */
            cursor: pointer; /* Zeigt an, dass man draufklicken könnte */
            position: relative;
            
            /* Kombiniert zwei Animationen: Wackeln und Hüpfen */
            animation: 
                wackeln 1s infinite ease-in-out alternate,
                huepfen 2s infinite ease-in-out;
            
            /* Verbessert die Darstellung auf Mobilgeräten */
            -webkit-user-select: none;
            user-select: none;
        }

        /* Wenn man mit der Maus drüberfährt, wird das Ei rot (als Warnung) */
        .ei-container:hover {
            color: #FF4500; /* OrangeRed */
            filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.8));
        }

        /* ANIMATION 1: Wackeln (Rotation um die eigene Achse) */
        @keyframes wackeln {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* ANIMATION 2: Hüpfen (Vertikale Bewegung) */
        @keyframes huepfen {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); } /* Hüpft leicht hoch */
        }

        /* Der kleine Spalt unten (Copyright) */
        .footer-stamp {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        /* Anpassung für kleinere Bildschirme (Handys) */
        @media (max-width: 600px) {
            .spruch-oben { font-size: 1.8rem; }
            .ei-container { font-size: 10rem; }
        }
    </style>
</head>
<body>

    <div class="spruch-oben">
        Eier lecken
    </div>

    <div class="ei-container" title="Es wackelt...">
        🥚
    </div>

    <div class="footer-stamp">
        © ALLE RECHTE VORBEHALTEN LG NIKO
    </div>

</body>
</html>

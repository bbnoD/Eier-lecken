<!DOCTYPE html>
<html>
<head>
    <title>Wird geladen...</title>
    <script>
        // Liste deiner verfügbaren Seiten
        const seiten = [
            'index1.html',
            'index2.html',
            'index3.html'

        ];

        // Zufälligen Index auswählen
        const zufallsIndex = Math.floor(Math.random() * seiten.length);
        
        // Ziel-Seite auswählen
        const zielSeite = seiten[zufallsIndex];

        // Weiterleitung ausführen (ersetzt den Verlaufseintrag, damit "Zurück" nicht in der Schleife landet)
        window.location.replace(zielSeite);
    </script>
    
    <!-- Falls JavaScript deaktiviert ist, zeigen wir einen Link an -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=index1.html">
    </noscript>
</head>
<body style="background-color: #000;">
    <!-- Seite bleibt schwarz oder zeigt einen Lade-Spinner während des Sprungs -->
</body>
</html>
